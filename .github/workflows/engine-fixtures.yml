name: Engine fixture verification
on:
  pull_request:
    paths:
      - 'src/service/**'
      - 'native/**'
      - 'clients/**'
      - 'vendor/**'
      - 'packages/pi-subagents/**'
      - 'scripts/build-native'
      - 'scripts/setup'
      - 'scripts/verify'
      - 'scripts/verify-members'
      - '.node-version'
      - 'tsconfig.json'
      - 'packages/client/**'
      - 'scripts/generate-openapi.mjs'
      - 'scripts/verify-client-package.mjs'
      - 'tests/**'
      - 'package*.json'
      - 'docs/integration-api-v1.md'
      - '.github/workflows/engine-fixtures.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-fixtures-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture:
    name: fixture (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        engine: [claude, codex, pi]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up the fixture toolchain
        run: scripts/setup --mode fixture
      - name: Install pinned Beans
        run: |
          case "$(uname -m)" in
            aarch64|arm64) asset=bn-linux-aarch64; sum=1781e4b56f7b323a6f509515895d6001edefb151f8a393f7d4004755b7e8ceed ;;
            x86_64) asset=bn-linux-x86_64; sum=186a92639d957706c2a702c687dec6da22e916c0d6700e4e5cbcdce34b6e382e ;;
            *) echo "Unsupported architecture" >&2; exit 1 ;;
          esac
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://github.com/mattsp1290/beans/releases/download/v0.3.0/$asset" -o ".proof/bin/$asset"
          echo "$sum  .proof/bin/$asset" | sha256sum -c -
          install -m 755 ".proof/bin/$asset" .proof/bin/bn
          rm -f ".proof/bin/$asset"
          .proof/bin/bn --version | grep -qx 'bn v0.3.0'
      - name: Verify the fixture engine
        env:
          ENGINE: ${{ matrix.engine }}
          BIRBCREW_FIXTURE_EVIDENCE: ${{ runner.temp }}/fixture-evidence.json
        run: |
          case "$ENGINE" in
            claude|codex|pi) ;;
            *) echo "Refusing to run scripts/verify without --engine" >&2; exit 2 ;;
          esac
          scripts/verify --mode fixture --engine "$ENGINE"
