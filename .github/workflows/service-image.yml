name: Service image
on:
  pull_request:
    paths:
      - 'packaging/**'
      - 'src/service/**'
      - 'native/**'
      - 'scripts/build-native'
      - 'package*.json'
      - 'vendor/**'
      - 'packages/**'
      - '.github/workflows/service-image.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_IMAGE: node:24.22.3-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a base image without a digest
        run: |
          if docker buildx build -f packaging/service.Dockerfile --target build \
              --build-arg NODE_IMAGE=node:24.22.3-bookworm-slim . > guard.log 2>&1; then
            echo "The build accepted an unpinned base image" >&2
            exit 1
          fi
          grep -Eq '^#[0-9]+ [0-9.]+ Pin NODE_IMAGE by digest' guard.log
      - run: docker buildx build --load -f packaging/service.Dockerfile --build-arg NODE_IMAGE="$NODE_IMAGE" -t crew-service:ci .
      - name: Run hardened
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777 crew-service:ci sh -ec '
              test "$(id -u):$(id -g)" = 10001:10001
              tr "\0" " " < /proc/1/cmdline | grep -q "^/usr/bin/tini -- "
              if touch /var/lib/birbcrew/native/probe 2>/dev/null; then exit 1; fi
              touch /tmp/probe
              test -x /app/.proof/bin/member-launch
              test -s /etc/ssl/certs/ca-certificates.crt
              test "$BIRBCREW_STATE_DIR" = /var/lib/birbcrew/native
              node -e "require(\"@swc/core\")"
              test -s /app/packages/client/LICENSE
              node --input-type=module -e "
                import assert from \"node:assert/strict\";
                import { CrewClient } from \"@birbcrew/client\";
                import { engineSchema } from \"@birbcrew/client/contract\";
                import { createCrewObserver } from \"@birbcrew/client/agui\";
                import { spawnSchema } from \"/app/src/service/domain.ts\";
                assert.equal(typeof CrewClient, \"function\");
                assert.equal(typeof createCrewObserver, \"function\");
                assert.equal(engineSchema.parse(\"codex\"), \"codex\");
                assert.equal(spawnSchema.shape.engine, engineSchema);
                assert.throws(() => import.meta.resolve(\"typescript\"), { code: \"ERR_MODULE_NOT_FOUND\" });
              "
              node --input-type=module -e "await import(\"/app/src/service/gateway.ts\"); await import(\"/app/src/service/worker.ts\")"
            '
