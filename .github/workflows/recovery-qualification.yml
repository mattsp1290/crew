name: Quiesced recovery qualification
on:
  pull_request:
    paths:
      - 'src/service/**'
      - 'tests/service/**'
      - 'tests/proof/**'
      - 'package*.json'
      - 'docs/coordinated-recovery.md'
      - '.github/workflows/recovery-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: birbcrew
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BIRBCREW_TEST_DATABASE_URL: postgresql://birbcrew:fixture-only@127.0.0.1:5432/recovery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:recovery
        env:
          BIRBCREW_RECOVERY_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: node --test tests/service/store.test.ts
      - run: npm run test:recovery:native
      - name: Install pinned Temporal CLI
        run: |
          mkdir -p .proof/bin
          archive=temporal_cli_1.10.0_linux_amd64.tar.gz
          curl -fsSL "https://github.com/temporalio/cli/releases/download/v1.10.0/$archive" -o ".proof/bin/$archive"
          curl -fsSL https://github.com/temporalio/cli/releases/download/v1.10.0/checksums.txt -o .proof/bin/checksums.txt
          (cd .proof/bin && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf ".proof/bin/$archive" -C .proof/bin temporal
      - run: npm run test:recovery:coordinated
        env:
          TEMPORAL_CLI: ${{ github.workspace }}/.proof/bin/temporal
