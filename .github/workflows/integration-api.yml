name: Native lifecycle diagnostic probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Prepare proof diagnostic directory
        run: |
          mkdir -p "$RUNNER_TEMP/crew-service-proofs"
          echo "BIRBCREW_PROOF_ARTIFACTS=$RUNNER_TEMP/crew-service-proofs" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix clients --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Install pinned Temporal CLI
        run: |
          mkdir -p .proof/bin
          archive=temporal_cli_1.10.0_linux_amd64.tar.gz
          curl -fsSL "https://github.com/temporalio/cli/releases/download/v1.10.0/$archive" -o ".proof/bin/$archive"
          curl -fsSL https://github.com/temporalio/cli/releases/download/v1.10.0/checksums.txt -o .proof/bin/checksums.txt
          (cd .proof/bin && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf ".proof/bin/$archive" -C .proof/bin temporal
      - name: Proof lifecycle cancellation contract probe
        id: contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BIRBCREW_PROOF_ARTIFACTS"
          date -u +%FT%TZ > "$BIRBCREW_PROOF_ARTIFACTS/contracts-started-utc.txt"
          node --test --test-name-pattern='^remote real fixture forced timeout recovers PostgreSQL, Temporal and worker$' tests/proof/member-services.test.mts
        env:
          TEMPORAL_CLI: ${{ github.workspace }}/.proof/bin/temporal
      - name: Recover exact cancellation probe fixture
        if: ${{ always() }}
        timeout-minutes: 1
        run: node tests/proof/platform-recovery-probe.mjs
        env:
          CONTRACTS_CONCLUSION: ${{ steps.contracts.conclusion }}
      - name: Independently inspect cancellation probe resource absence
        if: ${{ always() }}
        timeout-minutes: 1
        run: node tests/proof/platform-inspection-probe.mjs
      - name: Retain actual-service failure diagnostics
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: actual-service-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crew-service-proofs
          if-no-files-found: warn
          retention-days: 7
