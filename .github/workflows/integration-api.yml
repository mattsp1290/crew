name: Versioned integration API qualification
on:
  pull_request:
    paths:
      - 'src/service/**'
      - 'native/**'
      - 'clients/**'
      - 'vendor/**'
      - 'packages/pi-subagents/**'
      - 'scripts/build-native'
      - 'scripts/setup'
      - 'scripts/install-temporal-cli'
      - 'scripts/qualify-cursor-restricted-text.mjs'
      - 'scripts/cursor-canary.py'
      - 'scripts/qualify-cursor-service.py'
      - 'scripts/cursor-service-drain.mjs'
      - 'packaging/cursor-candidate.Dockerfile'
      - '.node-version'
      - 'tsconfig.json'
      - 'packages/client/**'
      - 'scripts/generate-openapi.mjs'
      - 'scripts/verify-client-package.mjs'
      - 'tests/**'
      - 'package*.json'
      - 'docs/**'
      - '.github/workflows/integration-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: echo "CREW_NODE22=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - run: echo "CREW_NODE24=$(command -v node)" >> "$GITHUB_ENV"
      - run: '"$CREW_NODE22" scripts/verify-client-package.mjs'
  consumer-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: birbcrew
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIRBCREW_TEST_DATABASE_URL: postgresql://birbcrew:fixture-only@127.0.0.1:5432/integration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Isolated CI diagnostic contracts
        run: node --test tests/proof/isolated-ci.test.mts
      - name: Cursor candidate launcher contracts (no inference)
        run: node --test tests/proof/cursor-candidate-launcher.test.mjs
      - name: Synthetic Cursor network observer
        run: |
          python3 tests/proof/cursor_canary_test.py
          python3 tests/proof/cursor_service_launcher_test.py
      - name: Cursor live proof phase contracts (no inference)
        run: node --test tests/proof/cursor-service-phase.test.mts
      - run: npm run test:client
      - run: npm run check:openapi
      - run: npm run test:api
      - run: npm run test:trusted
      - run: npm run test:observers
      - run: npm run test:audit
      - run: npm run test:routines
      - run: npm run test:memories
      - run: npm run test:instructions
      - run: npm run test:packs
      - run: npm run test:grants
      - run: npm run test:capabilities
      - run: npm run test:handoffs
      - run: npm run test:expiry
      - run: npm run test:usage
      - run: npm run test:usage:capture
      - run: npm run test:webhooks
      - run: node --test tests/service/store.test.ts tests/service/rollover-client.test.ts tests/service/content-erasure.test.ts
      - run: node --test tests/service/approvals.test.ts tests/service/codex-calls.test.ts tests/service/codex-registration.test.ts
      - name: Turn failure diagnostics
        run: node --test tests/service/native-diagnostics.test.ts
      - name: Install pinned Temporal CLI
        run: |
          mkdir -p .proof/bin
          scripts/install-temporal-cli .proof/bin
      - run: npm run test:child-targets
        env:
          TEMPORAL_CLI: ${{ github.workspace }}/.proof/bin/temporal
  text-members:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: birbcrew
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: text_member_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIRBCREW_TEST_DATABASE_URL: postgresql://birbcrew:fixture-only@127.0.0.1:5432/text_member_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install pinned Temporal CLI
        run: |
          mkdir -p .proof/bin
          scripts/install-temporal-cli .proof/bin
      - name: Cursor installed policy and registration contracts (no inference)
        run: node --test tests/service/cursor-runtime-contract.test.ts tests/service/cursor-policy-support.test.ts tests/service/cursor-turn.test.ts
      - name: Install pinned Beans
        run: |
          asset=bn-linux-x86_64
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL "https://github.com/mattsp1290/beans/releases/download/v0.3.0/$asset" -o ".proof/bin/$asset"
          echo "186a92639d957706c2a702c687dec6da22e916c0d6700e4e5cbcdce34b6e382e  .proof/bin/$asset" | sha256sum -c -
          install -m 755 ".proof/bin/$asset" .proof/bin/bn
      - name: Qualify text members without provider inference
        env:
          BIRBCREW_TEMPORAL_ADDRESS: 127.0.0.1:7233
          BIRBCREW_TEMPORAL_NAMESPACE: default
          BIRBCREW_TEXT_EVIDENCE_DIR: ${{ runner.temp }}/text-member-evidence
          CREW_TEXT_BLOB_LIMIT: '2097152'
          CREW_TEXT_TRANSACTION_LIMIT: '4194304'
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/.proof/bin:$PATH"
          git --version
          bn --version | grep -qx 'bn v0.3.0'
          export BIRBCREW_TEXT_TEMPORAL_CLI_VERSION="$(cat .proof/bin/temporal-cli-version)"
          export BIRBCREW_TEXT_SERVER_LIMITS="{\"blobSizeLimitError\":$CREW_TEXT_BLOB_LIMIT,\"transactionSizeLimit\":$CREW_TEXT_TRANSACTION_LIMIT}"
          temporal server start-dev --headless --port 7233 --dynamic-config-value "limit.blobSize.error=$CREW_TEXT_BLOB_LIMIT" --dynamic-config-value "system.transactionSizeLimit=$CREW_TEXT_TRANSACTION_LIMIT" --db-filename "$RUNNER_TEMP/text-temporal.db" > "$RUNNER_TEMP/text-temporal.log" 2>&1 &
          temporal_pid=$!
          trap 'kill "$temporal_pid"; wait "$temporal_pid" || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if temporal operator cluster health --address 127.0.0.1:7233 --command-timeout 1s; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          npm run check:openapi
          node --test --test-concurrency=1 tests/service/text-profile-validation.test.ts tests/service/text-member-contract.test.ts tests/service/text-member-gateway.test.ts
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: text-member-evidence
          path: |
            ${{ runner.temp }}/text-member-evidence/
            ${{ runner.temp }}/text-temporal.log
          retention-days: 7
  native-service:
    name: native-service (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: text-member-erasure
            entry: tests/proof/text-member-erasure.mts
          - suite: api
            entry: tests/proof/integration-api.mts
          - suite: tls
            entry: tests/proof/temporal-tls.mts
          - suite: observer-processes
            entry: tests/proof/native-observers.mts
            mode: processes
          - suite: observation-file
            entry: tests/proof/native-observers.mts
            mode: file
          - suite: routines
            entry: tests/proof/routines.mts
          - suite: memories
            entry: tests/proof/memories.mts
          - suite: instructions
            entry: tests/proof/member-instructions.mts
          - suite: handoffs
            entry: tests/proof/handoffs.mts
    env:
      TEMPORAL_CLI: ${{ github.workspace }}/.proof/bin/temporal
      BIRBCREW_PROOF_ARTIFACTS: ${{ github.workspace }}/.proof/artifacts/${{ matrix.suite }}
      BIRBCREW_PROOF_WORKING_STATE: github-hosted-vm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Install and build pinned fixtures
        timeout-minutes: 6
        run: |
          mkdir -p "$BIRBCREW_PROOF_ARTIFACTS" .proof/bin
          printf 'fixture setup started\n' > "$BIRBCREW_PROOF_ARTIFACTS/setup-phase.txt"
          exec node tests/proof/member-service-diagnostics.mts --command "$BIRBCREW_PROOF_ARTIFACTS/setup.log" bash -euo pipefail -c '
            npm ci
            npm ci --prefix clients --ignore-scripts --no-audit --no-fund
            npm run build
            scripts/install-temporal-cli .proof/bin
          '
      - name: Run actual native suite
        timeout-minutes: 21
        env:
          PROOF_ENTRY: ${{ matrix.entry }}
          PROOF_MODE: ${{ matrix.mode }}
        run: exec node tests/proof/member-service-diagnostics.mts --command "$BIRBCREW_PROOF_ARTIFACTS/command.log" node "$PROOF_ENTRY" "$PROOF_MODE"
      - name: Collect bounded retained diagnostics
        if: ${{ always() }}
        timeout-minutes: 1
        run: node tests/proof/member-service-diagnostics.mts --collect "$BIRBCREW_PROOF_ARTIFACTS"
      - name: Upload native suite evidence
        if: ${{ always() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: native-service-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .proof/artifacts/${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 7
  actual-service:
    if: ${{ always() }}
    needs: native-service
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every native suite
        env:
          NATIVE_RESULT: ${{ needs.native-service.result }}
        run: test "$NATIVE_RESULT" = success

  delegation-control:
    name: delegation-control (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: sql
            script: test:delegation-control:sql
          - suite: store
            script: test:delegation-control
          - suite: workflow
            script: test:delegation-control:workflow
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: birbcrew
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: delegation_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIRBCREW_TEST_DATABASE_URL: postgresql://birbcrew:fixture-only@127.0.0.1:5432/delegation_control_test
      BIRBCREW_CONTROL_PROOF_DIR: ${{ github.workspace }}/.proof/artifacts/delegation-${{ matrix.suite }}
      BIRBCREW_PROOF_WORKING_STATE: github-hosted-vm
      TEMPORAL_CLI: ${{ github.workspace }}/.proof/bin/temporal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Install and build pinned fixtures
        timeout-minutes: 6
        run: |
          mkdir -p "$BIRBCREW_CONTROL_PROOF_DIR" .proof/bin
          exec node tests/proof/member-service-diagnostics.mts --command "$BIRBCREW_CONTROL_PROOF_DIR/setup.log" bash -euo pipefail -c '
            npm ci
            npm run build
            scripts/install-temporal-cli .proof/bin
          '
      - name: Run isolated control suite
        timeout-minutes: 16
        env:
          CONTROL_SCRIPT: ${{ matrix.script }}
        run: exec node tests/proof/member-service-diagnostics.mts --command "$BIRBCREW_CONTROL_PROOF_DIR/command.log" npm run "$CONTROL_SCRIPT"
      - name: Collect bounded control diagnostics
        if: ${{ always() }}
        timeout-minutes: 1
        run: node tests/proof/member-service-diagnostics.mts --collect "$BIRBCREW_CONTROL_PROOF_DIR"
      - name: Retain control suite evidence
        if: ${{ always() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: delegation-control-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .proof/artifacts/delegation-${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 7
