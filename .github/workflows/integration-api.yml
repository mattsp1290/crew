name: NEVERMERGE PR76 current-parent delivery probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    name: PR76 delivery (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            revision: 17684dd5a6867c73aa17ea6ceea609d3f8511b11
          - label: head
            revision: 7c919782b77f9b290a296c01e406a8cbf5f3f69c
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: birbcrew
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PR76_DATABASE_URL: postgresql://birbcrew:fixture-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
          sparse-checkout: |
            tests/proof/pr76-current-qualification.mjs
            tests/proof/pr76-current-public.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Install pinned Temporal CLI for head only
        timeout-minutes: 5
        if: matrix.label == 'head'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/head tools
          archive=temporal_cli_1.10.0_linux_amd64.tar.gz
          curl -fsSL "https://github.com/temporalio/cli/releases/download/v1.10.0/$archive" -o "tools/$archive"
          curl -fsSL https://github.com/temporalio/cli/releases/download/v1.10.0/checksums.txt -o tools/checksums.txt
          (cd tools && grep " $archive$" checksums.txt | sha256sum -c -) | tee artifacts/head/temporal-checksum.log
          cp tools/checksums.txt artifacts/head/temporal-official-checksums.txt
          tar -xzf "tools/$archive" -C tools temporal
          echo "TEMPORAL_CLI=$GITHUB_WORKSPACE/tools/temporal" >> "$GITHUB_ENV"
      - name: Run exact source and retain raw proof
        timeout-minutes: 20
        working-directory: source
        env:
          PR76_LABEL: ${{ matrix.label }}
          PR76_REVISION: ${{ matrix.revision }}
          PR76_PROBE_SHA: ${{ github.sha }}
          BIRBCREW_RECOVERY_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: exec node ../controller/tests/proof/pr76-current-qualification.mjs
      - name: Upload proof even on failure
        timeout-minutes: 2
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr76-current-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 7
