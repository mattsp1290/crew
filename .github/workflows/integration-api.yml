name: Native lifecycle diagnostic probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BIRBCREW_PROOF_ARTIFACTS: ${{ runner.temp }}/crew-service-proofs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix clients --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Install pinned Temporal CLI
        run: |
          mkdir -p .proof/bin
          archive=temporal_cli_1.10.0_linux_amd64.tar.gz
          curl -fsSL "https://github.com/temporalio/cli/releases/download/v1.10.0/$archive" -o ".proof/bin/$archive"
          curl -fsSL https://github.com/temporalio/cli/releases/download/v1.10.0/checksums.txt -o .proof/bin/checksums.txt
          (cd .proof/bin && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf ".proof/bin/$archive" -C .proof/bin temporal
      - name: test:temporal:tls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BIRBCREW_PROOF_ARTIFACTS"
          timeout --signal=TERM --kill-after=90s 20m node tests/proof/member-service-diagnostics.mts --command "$BIRBCREW_PROOF_ARTIFACTS/tls.stdout.log" npm run test:temporal:tls
        env:
          TEMPORAL_CLI: ${{ github.workspace }}/.proof/bin/temporal
      - name: Retain actual-service failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: actual-service-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crew-service-proofs
          if-no-files-found: warn
          retention-days: 7
