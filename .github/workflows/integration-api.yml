name: NEVER MERGE actual worker OTLP qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-worker:
    if: startsWith(github.ref_name, 'probe/otlp-worker-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OTLP_PROBE_ONLY: NEVER_MERGE
      TEMPORAL_CLI: ${{ github.workspace }}/.proof/bin/temporal
      BIRBCREW_PROOF_ARTIFACTS: ${{ github.workspace }}/.proof/artifacts/otlp-worker
      BIRBCREW_PROOF_WORKING_STATE: github-hosted-vm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Pin complete source before setup
        run: node tests/proof/otlp-worker-qualification/stager.mjs --before
      - name: Install registry graph and build native fixtures
        timeout-minutes: 6
        run: |
          mkdir -p "$BIRBCREW_PROOF_ARTIFACTS" .proof/bin
          exec timeout --signal=TERM --kill-after=8s 340s node tests/proof/member-service-diagnostics.mts --command "$BIRBCREW_PROOF_ARTIFACTS/setup.log" bash -euo pipefail -c '
            npm ci --no-audit --no-fund
            npm ci --prefix clients --ignore-scripts --no-audit --no-fund
            npm run build
            archive=temporal_cli_1.10.0_linux_amd64.tar.gz
            curl --retry 2 --connect-timeout 10 --max-time 60 -fsSL "https://github.com/temporalio/cli/releases/download/v1.10.0/$archive" -o ".proof/bin/$archive"
            curl --retry 2 --connect-timeout 10 --max-time 60 -fsSL https://github.com/temporalio/cli/releases/download/v1.10.0/checksums.txt -o .proof/bin/checksums.txt
            (cd .proof/bin && grep " $archive$" checksums.txt | sha256sum -c -)
            tar -xzf ".proof/bin/$archive" -C .proof/bin temporal
            sha256sum ".proof/bin/$archive" .proof/bin/temporal > "$BIRBCREW_PROOF_ARTIFACTS/temporal-identity.txt"
          '
      - name: Verify all original bytes then stage only reviewed existing outputs
        run: node tests/proof/otlp-worker-qualification/stager.mjs --stage
      - name: Actual CLI worker healthy and endless response qualification
        timeout-minutes: 5
        run: exec timeout --signal=TERM --kill-after=8s 260s node tests/proof/member-service-diagnostics.mts --command "$BIRBCREW_PROOF_ARTIFACTS/command.log" node tests/proof/otlp-worker-probe.mts
      - name: Verify complete source and installed output hashes after qualification
        if: ${{ always() }}
        timeout-minutes: 1
        run: node tests/proof/otlp-worker-qualification/stager.mjs --verify
      - name: Collect bounded allowlisted retained diagnostics
        if: ${{ always() }}
        timeout-minutes: 1
        run: node tests/proof/member-service-diagnostics.mts --collect "$BIRBCREW_PROOF_ARTIFACTS"
      - name: Upload bounded probe evidence
        if: ${{ always() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: otlp-worker-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: .proof/artifacts/otlp-worker/
          if-no-files-found: error
          retention-days: 7
