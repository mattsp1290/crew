name: Docker disappearance diagnostic qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare proof diagnostic directory
        run: |
          mkdir -p "$RUNNER_TEMP/crew-service-proofs"
          echo "BIRBCREW_PROOF_ARTIFACTS=$RUNNER_TEMP/crew-service-proofs" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - name: Pull the exact fixture image
        run: docker pull postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
      - name: Qualify exact container ownership refusal
        timeout-minutes: 1
        run: node tests/proof/container-guard-probe.mts
      - name: Observe exact missing-container command outcomes
        timeout-minutes: 1
        run: node tests/proof/docker-missing-probe.mjs "$BIRBCREW_PROOF_ARTIFACTS"
      - name: Retain actual-service failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: actual-service-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crew-service-proofs
          if-no-files-found: warn
          retention-days: 7
