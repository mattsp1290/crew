name: Isolated native CI hosted qualification probe
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Hosted qualification case
        type: choice
        required: true
        options:
          - early-setup-failure
          - setup-cancel
          - native-failure
          - native-catchable
          - native-stopped
permissions:
  contents: read
jobs:
  qualification:
    name: qualification (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QUALIFICATION_MODE: ${{ inputs.mode }}
      TEMPORAL_CLI: ${{ github.workspace }}/.proof/bin/temporal
      BIRBCREW_PROOF_ARTIFACTS: ${{ github.workspace }}/.proof/artifacts/${{ inputs.mode }}
      BIRBCREW_PROOF_WORKING_STATE: github-hosted-vm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Record tracked source identity before qualification
        run: node tests/proof/qualification-isolated-setup.mjs identity-before
      - name: Prepare dependency-free setup interception
        if: ${{ inputs.mode == 'early-setup-failure' || inputs.mode == 'setup-cancel' }}
        run: |
          mkdir -p "$RUNNER_TEMP/qualification-bin"
          ln -s "$GITHUB_WORKSPACE/tests/proof/qualification-isolated-setup.mjs" "$RUNNER_TEMP/qualification-bin/npm"
          echo "$RUNNER_TEMP/qualification-bin" >> "$GITHUB_PATH"
      - name: Install and build pinned fixtures
        timeout-minutes: 6
        run: |
          mkdir -p "$BIRBCREW_PROOF_ARTIFACTS" .proof/bin
          printf 'fixture setup started\n' > "$BIRBCREW_PROOF_ARTIFACTS/setup-phase.txt"
          node tests/proof/member-service-diagnostics.mts --command "$BIRBCREW_PROOF_ARTIFACTS/setup.log" bash -euo pipefail -c '
            npm ci
            npm ci --prefix clients --ignore-scripts --no-audit --no-fund
            npm run build
            archive=temporal_cli_1.10.0_linux_amd64.tar.gz
            curl -fsSL "https://github.com/temporalio/cli/releases/download/v1.10.0/$archive" -o ".proof/bin/$archive"
            curl -fsSL https://github.com/temporalio/cli/releases/download/v1.10.0/checksums.txt -o .proof/bin/checksums.txt
            (cd .proof/bin && grep " $archive$" checksums.txt | sha256sum -c -)
            tar -xzf ".proof/bin/$archive" -C .proof/bin temporal
          '
      - name: Run actual native fixture
        timeout-minutes: 21
        run: node tests/proof/member-service-diagnostics.mts --command "$BIRBCREW_PROOF_ARTIFACTS/command.log" node tests/proof/qualification-isolated-cancel.mts "$QUALIFICATION_MODE"
      - name: Record tracked source identity after qualification
        if: ${{ always() }}
        timeout-minutes: 1
        run: node tests/proof/qualification-isolated-setup.mjs identity-after
      - name: Collect bounded retained diagnostics
        if: ${{ always() }}
        timeout-minutes: 1
        run: node tests/proof/member-service-diagnostics.mts --collect "$BIRBCREW_PROOF_ARTIFACTS"
      - name: Upload native suite evidence
        if: ${{ always() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: native-service-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .proof/artifacts/${{ inputs.mode }}/
          if-no-files-found: error
          retention-days: 7
