name: Versioned integration API qualification
run-name: Unavailable Docker lifecycle qualification
on:
  pull_request:
    paths:
      - 'src/service/**'
      - 'packages/client/**'
      - 'packages/pi-subagents/**'
      - 'clients/**'
      - 'native/**'
      - 'vendor/**'
      - 'scripts/build-native'
      - 'tsconfig.json'
      - 'scripts/generate-openapi.mjs'
      - 'scripts/verify-client-package.mjs'
      - 'tests/**'
      - 'package*.json'
      - 'docs/integration-api-v1.md'
      - '.github/workflows/integration-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Prepare proof diagnostic directory
        run: |
          mkdir -p "$RUNNER_TEMP/crew-service-proofs"
          echo "BIRBCREW_PROOF_ARTIFACTS=$RUNNER_TEMP/crew-service-proofs" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix clients --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Install pinned Temporal CLI
        run: |
          mkdir -p .proof/bin
          archive=temporal_cli_1.10.0_linux_amd64.tar.gz
          curl -fsSL "https://github.com/temporalio/cli/releases/download/v1.10.0/$archive" -o ".proof/bin/$archive"
          curl -fsSL https://github.com/temporalio/cli/releases/download/v1.10.0/checksums.txt -o .proof/bin/checksums.txt
          (cd .proof/bin && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf ".proof/bin/$archive" -C .proof/bin temporal
      - name: Proof lifecycle failure contracts
        id: lifecycle_contracts
        run: node --test --test-name-pattern='^remote real fixture forced timeout recovers' tests/proof/member-services.test.mts
        env:
          TEMPORAL_CLI: ${{ github.workspace }}/.proof/bin/temporal
      - name: Observe settled Docker fixture before invalid endpoint
        id: docker_pre
        if: ${{ always() }}
        timeout-minutes: 1
        run: node tests/proof/qualification-unavailable-docker.mts pre "$BIRBCREW_PROOF_ARTIFACTS"
      - name: Recover lifecycle contract fixtures through unavailable endpoint
        id: invalid_recovery
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          test ! -e "$RUNNER_TEMP/crew-no-daemon.sock"
          env -u DOCKER_CONTEXT DOCKER_HOST="unix://$RUNNER_TEMP/crew-no-daemon.sock" node tests/proof/member-service-recovery.mts --contracts "$BIRBCREW_PROOF_ARTIFACTS"
        env:
          CONTRACTS_CONCLUSION: ${{ steps.lifecycle_contracts.conclusion }}
      - name: Inspect lifecycle contract fixtures through unavailable endpoint
        id: invalid_inspection
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          test ! -e "$RUNNER_TEMP/crew-no-daemon.sock"
          env -u DOCKER_CONTEXT DOCKER_HOST="unix://$RUNNER_TEMP/crew-no-daemon.sock" node tests/proof/member-service-inspection.mts --contracts "$BIRBCREW_PROOF_ARTIFACTS"
        env:
          CONTRACTS_CONCLUSION: ${{ steps.lifecycle_contracts.conclusion }}
      - name: Observe same Docker fixture after invalid endpoint
        id: docker_after_invalid
        if: ${{ always() }}
        timeout-minutes: 1
        run: node tests/proof/qualification-unavailable-docker.mts after-invalid "$BIRBCREW_PROOF_ARTIFACTS"
      - name: Recover lifecycle contract fixtures
        id: normal_recovery
        if: ${{ always() }}
        timeout-minutes: 1
        run: node tests/proof/member-service-recovery.mts --contracts "$BIRBCREW_PROOF_ARTIFACTS"
        env:
          CONTRACTS_CONCLUSION: ${{ steps.lifecycle_contracts.conclusion }}
      - name: Inspect lifecycle contract fixtures
        id: normal_inspection
        if: ${{ always() }}
        timeout-minutes: 1
        run: node tests/proof/member-service-inspection.mts --contracts "$BIRBCREW_PROOF_ARTIFACTS"
        env:
          CONTRACTS_CONCLUSION: ${{ steps.lifecycle_contracts.conclusion }}
      - name: Observe exact Docker fixture absence after production cleanup
        id: docker_final
        if: ${{ always() }}
        timeout-minutes: 1
        run: node tests/proof/qualification-unavailable-docker.mts final "$BIRBCREW_PROOF_ARTIFACTS"
        env:
          QUALIFICATION_CONTRACTS: ${{ steps.lifecycle_contracts.conclusion }}
          QUALIFICATION_PRE: ${{ steps.docker_pre.conclusion }}
          QUALIFICATION_INVALID_RECOVERY: ${{ steps.invalid_recovery.conclusion }}
          QUALIFICATION_INVALID_INSPECTION: ${{ steps.invalid_inspection.conclusion }}
          QUALIFICATION_AFTER_INVALID: ${{ steps.docker_after_invalid.conclusion }}
          QUALIFICATION_NORMAL_RECOVERY: ${{ steps.normal_recovery.conclusion }}
          QUALIFICATION_NORMAL_INSPECTION: ${{ steps.normal_inspection.conclusion }}
      - name: Retain unavailable Docker qualification sources
        if: ${{ always() }}
        timeout-minutes: 1
        run: |
          mkdir -p "$BIRBCREW_PROOF_ARTIFACTS/qualification-unavailable-docker"
          cp tests/proof/qualification-unavailable-docker-inputs.json tests/proof/qualification-unavailable-docker.patch tests/proof/qualification-unavailable-docker.mts "$BIRBCREW_PROOF_ARTIFACTS/qualification-unavailable-docker/"
      - name: Retain actual-service failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: final-unavailable-docker-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crew-service-proofs
          if-no-files-found: error
          retention-days: 7
