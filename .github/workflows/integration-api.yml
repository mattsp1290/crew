name: Delegation control full feature qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable feature commit to qualify
        required: true
        default: 23315d46b8f782597680b9ac94e4281d362cb413
        type: string
      suites:
        description: JSON suite selection. Use ["rollback"] for the retained rollback experiment.
        required: true
        default: '["sql","store","workflow","restore"]'
        type: string
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suites) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: birbcrew
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        if: ${{ matrix.suite == 'rollback' }}
        with:
          ref: f3327346d979270a18c9f46b9cfe6a075b1cb157
          path: old-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
          sparse-checkout: tests/proof/control-sql-boundaries.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Qualify exact source in an independent fresh environment
        timeout-minutes: 45
        working-directory: source
        env:
          CONTROL_SQL_SOURCE: ${{ inputs.source_sha }}
          CONTROL_SQL_CONTROLLER: ${{ github.sha }}
          CONTROL_SQL_SUITE: ${{ matrix.suite }}
          CONTROL_SQL_DATABASE_URL: postgresql://birbcrew:fixture-only@127.0.0.1:5432/postgres
          CONTROL_SQL_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: exec node ../controller/tests/proof/control-sql-boundaries.mjs
      - name: Retain raw proof on every outcome
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: control-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
