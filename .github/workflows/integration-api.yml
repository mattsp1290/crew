name: NEVER MERGE final archive install and actual worker qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-install:
    if: startsWith(github.ref_name, 'probe/otlp-worker-')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        install-scripts: [enabled, disabled]
    env:
      OTLP_PROBE_ONLY: NEVER_MERGE
      OTLP_INSTALL_VARIANT: ${{ matrix.install-scripts }}
      TEMPORAL_CLI: ${{ github.workspace }}/.proof/bin/temporal
      BIRBCREW_PROOF_ARTIFACTS: ${{ github.workspace }}/.proof/artifacts/otlp-worker
      BIRBCREW_PROOF_WORKING_STATE: github-hosted-vm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Pin complete source and local archive and prepare fresh physical install
        run: node tests/proof/otlp-worker-qualification/inspector.mjs --prepare
      - name: Install the authentic candidate graph directly from its lock
        timeout-minutes: 7
        run: |
          exec timeout --signal=TERM --kill-after=8s 400s node tests/proof/member-service-diagnostics.mts --command "$BIRBCREW_PROOF_ARTIFACTS/install.log" bash -euo pipefail -c '
            cd "$OTLP_INSTALL_ROOT"
            node --version
            npm --version
            if [ "$OTLP_INSTALL_VARIANT" = enabled ]; then
              npm ci --no-audit --no-fund
            else
              npm ci --ignore-scripts --no-audit --no-fund
            fi
          '
      - name: Verify all 327 installed bytes and exact direct and transitive identity
        run: node tests/proof/otlp-worker-qualification/inspector.mjs --installed
      - name: Build unchanged Crew native fixtures and pin Temporal CLI
        if: matrix.install-scripts == 'enabled'
        timeout-minutes: 6
        run: |
          mkdir -p .proof/bin
          exec timeout --signal=TERM --kill-after=8s 340s node tests/proof/member-service-diagnostics.mts --command "$BIRBCREW_PROOF_ARTIFACTS/setup.log" bash -euo pipefail -c '
            npm ci --prefix clients --ignore-scripts --no-audit --no-fund
            npm run build
            archive=temporal_cli_1.10.0_linux_amd64.tar.gz
            curl --retry 2 --connect-timeout 10 --max-time 60 -fsSL "https://github.com/temporalio/cli/releases/download/v1.10.0/$archive" -o ".proof/bin/$archive"
            curl --retry 2 --connect-timeout 10 --max-time 60 -fsSL https://github.com/temporalio/cli/releases/download/v1.10.0/checksums.txt -o .proof/bin/checksums.txt
            (cd .proof/bin && grep " $archive$" checksums.txt | sha256sum -c -)
            tar -xzf ".proof/bin/$archive" -C .proof/bin temporal
            sha256sum ".proof/bin/$archive" .proof/bin/temporal > "$BIRBCREW_PROOF_ARTIFACTS/temporal-identity.txt"
          '
      - name: Build the workspace client contract in the scripts-disabled copy
        if: matrix.install-scripts == 'disabled'
        timeout-minutes: 2
        run: |
          exec timeout --signal=TERM --kill-after=8s 90s node tests/proof/member-service-diagnostics.mts --command "$BIRBCREW_PROOF_ARTIFACTS/client-build.log" bash -euo pipefail -c '
            cd "$OTLP_INSTALL_ROOT"
            exec npm run build:client
          '
      - name: Run all 13 unchanged Crew telemetry tests and retain complete TAP
        timeout-minutes: 3
        run: |
          exec timeout --signal=TERM --kill-after=8s 150s node tests/proof/member-service-diagnostics.mts --command "$BIRBCREW_PROOF_ARTIFACTS/telemetry.tap" bash -euo pipefail -c '
            cd "$OTLP_INSTALL_ROOT"
            exec node --test --test-reporter=tap tests/service/telemetry-otlp.test.ts
          '
      - name: Retain maintained exporter regressions and artifact selection
        timeout-minutes: 3
        run: |
          exec timeout --signal=TERM --kill-after=8s 150s node tests/proof/member-service-diagnostics.mts --command "$BIRBCREW_PROOF_ARTIFACTS/exporter-regressions.tap" bash -euo pipefail -c '
            cd "$OTLP_INSTALL_ROOT"
            node --test --test-reporter=tap tests/service/telemetry-exporter-*.test.ts
            node --test --test-reporter=tap --test-name-pattern="bounded OTLP archive" tests/fixtures/engines/artifacts.test.ts
          '
      - name: Actual CLI worker healthy and endless response qualification
        if: matrix.install-scripts == 'enabled'
        timeout-minutes: 5
        run: exec timeout --signal=TERM --kill-after=8s 260s node tests/proof/member-service-diagnostics.mts --command "$BIRBCREW_PROOF_ARTIFACTS/command.log" node tests/proof/otlp-worker-probe.mts
      - name: Verify complete source and lock and installed bytes after qualification
        if: ${{ always() }}
        timeout-minutes: 1
        run: node tests/proof/otlp-worker-qualification/inspector.mjs --verify
      - name: Collect bounded allowlisted retained diagnostics
        if: ${{ always() }}
        timeout-minutes: 1
        run: node tests/proof/member-service-diagnostics.mts --collect "$BIRBCREW_PROOF_ARTIFACTS"
      - name: Require complete logs and final qualification receipts
        run: node tests/proof/otlp-worker-qualification/inspector.mjs --final
      - name: Upload bounded complete proof evidence
        if: ${{ always() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: otlp-final-install-${{ matrix.install-scripts }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .proof/artifacts/otlp-worker/
          if-no-files-found: error
          retention-days: 7
